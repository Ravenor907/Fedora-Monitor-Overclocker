[package]
name = "monitor-oc"
version = "0.2.0"
edition = "2024"
description = "Monitor refresh-rate overclocking via EDID overrides for SteamOS, Fedora and other Linux distros"
license = "GPL-3.0-or-later"
repository = "https://github.com/Ravenor907/monitor-oc"
rust-version = "1.95"

[features]
default = ["gui"]
# The graphical app. Without it (`--no-default-features`) the binary is the
# CLI only and builds as a fully static musl executable.
gui = ["dep:eframe", "dep:winit"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
eframe = { version = "0.36.2", optional = true, default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
# Not used directly: turns on winit's default features (Wayland loaded at
# runtime, client-side decorations on GNOME) as eframe's own defaults would.
winit = { version = "0.30.13", optional = true }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
