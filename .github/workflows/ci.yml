name: CI

# Monitor OC is installed and updated from this repository's source, like Ally Hub:
# scripts/install.sh builds it on the device. CI checks the code and that the
# install works the way it does on SteamOS (no C compiler there).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # luajit runs the Gamescope Lua harness and desktop-file-utils validates
      # the menu entries; those tests fail in CI when their tool is missing.
      # The GUI needs no -dev packages: eframe loads X11, Wayland and OpenGL
      # at runtime.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends luajit desktop-file-utils shellcheck
      - run: cargo fmt --check
      - run: .github/scripts/annotate.sh cargo clippy --all-targets --message-format=short -- -D warnings
      - run: .github/scripts/annotate.sh cargo clippy --all-targets --no-default-features --message-format=short -- -D warnings
      - run: .github/scripts/annotate.sh cargo test
      - run: .github/scripts/annotate.sh cargo test --no-default-features
      - run: shellcheck scripts/*.sh .github/scripts/*.sh

  # The real install, as on SteamOS: an Arch Linux system with no C compiler,
  # a normal user, `git clone` + scripts/install.sh, then scripts/uninstall.sh.
  install:
    needs: check
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - run: pacman -Syu --noconfirm --needed git curl python tar gzip which
      - uses: actions/checkout@v4
      - name: No C compiler, like SteamOS
        run: "! command -v cc"
      - name: Install as a normal user
        run: |
          useradd -m deck
          cp -r "$GITHUB_WORKSPACE" /home/deck/MonitorOC
          chown -R deck:deck /home/deck/MonitorOC
          su deck -c 'mkdir -p ~/Desktop && bash ~/MonitorOC/scripts/install.sh'
      - name: Check the install
        run: |
          su deck -c '~/.local/bin/monitor-oc --version'
          test "$(su deck -c '~/.local/bin/monitor-oc --version')" = "monitor-oc $(tr -d '[:space:]' < VERSION)"
          test -f /home/deck/.local/share/applications/io.github.ravenor907.MonitorOC.desktop
          test -x /home/deck/Desktop/io.github.ravenor907.MonitorOC.desktop
          ldd /home/deck/.local/bin/monitor-oc
      - name: Uninstall
        run: |
          su deck -c 'bash ~/MonitorOC/scripts/uninstall.sh'
          test ! -e /home/deck/.local/bin/monitor-oc
          test ! -e /home/deck/.local/share/monitor-oc
          test ! -e /home/deck/Desktop/io.github.ravenor907.MonitorOC.desktop
