name: CI

on:
  push:
    branches: [main, testing]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # luajit runs the Gamescope Lua harness and desktop-file-utils validates
      # the menu entries; those tests fail in CI when their tool is missing.
      # The GUI needs no -dev packages: eframe loads X11, Wayland and OpenGL
      # at runtime.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends luajit desktop-file-utils shellcheck
      - run: cargo fmt --check
      - run: .github/scripts/annotate.sh cargo clippy --all-targets --message-format=short -- -D warnings
      - run: .github/scripts/annotate.sh cargo clippy --all-targets --no-default-features --message-format=short -- -D warnings
      - run: .github/scripts/annotate.sh cargo test
      - run: .github/scripts/annotate.sh cargo test --no-default-features
      - run: shellcheck install.sh
      - run: desktop-file-validate packaging/Install-Monitor-OC.desktop

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          # The app (GUI + CLI). Built on the oldest supported Ubuntu so it
          # only needs glibc 2.35, which SteamOS, Fedora and Bazzite all exceed.
          - name: monitor-oc-x86_64
            os: ubuntu-22.04
            target: ""
            args: ""
            out: target/release/monitor-oc
          # Command line only and fully static: runs on any x86_64 Linux.
          - name: monitor-oc-x86_64-musl
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            args: --no-default-features --target x86_64-unknown-linux-musl
            out: target/x86_64-unknown-linux-musl/release/monitor-oc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - run: cargo build --release --locked ${{ matrix.args }}
      - name: Package
        run: |
          mkdir -p dist
          cp "${{ matrix.out }}" "dist/${{ matrix.name }}"
          cd dist
          sha256sum "${{ matrix.name }}" > "${{ matrix.name }}.sha256"
          cat "${{ matrix.name }}.sha256"
          "./${{ matrix.name }}" --version
      # Install into a throwaway home and remove again. A build with the
      # `gui` subcommand must add the menu entry; a CLI-only build must not.
      - name: Smoke-test install and uninstall
        env:
          HOME: ${{ runner.temp }}/home
        run: |
          mkdir -p "$HOME"
          bin="dist/${{ matrix.name }}"
          entry="$HOME/.local/share/applications/io.github.ravenor907.MonitorOC.desktop"
          "$bin" install
          find "$HOME" -type f | sort
          test -x "$HOME/.local/bin/monitor-oc"
          if "$bin" help gui >/dev/null 2>&1; then test -f "$entry"; else test ! -e "$entry"; fi
          "$HOME/.local/bin/monitor-oc" uninstall
          test -z "$(find "$HOME" -type f ! -name mimeinfo.cache)"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -l dist
      # v0.2.1 is a Stable release; v0.2.1.3 (four parts) is a test build,
      # published as a pre-release so releases/latest and install.sh skip it.
      - name: Check the tag against VERSION
        id: kind
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          tag=${GITHUB_REF_NAME#v}
          if [ "$tag" != "$version" ]; then
            echo "::error::tag v$tag does not match VERSION ($version)"
            exit 1
          fi
          case $version in
            *.*.*.*) echo "prerelease=true" >> "$GITHUB_OUTPUT"; echo "name=$version (testing)" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT"; echo "name=$version" >> "$GITHUB_OUTPUT" ;;
          esac
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.kind.outputs.name }}
          prerelease: ${{ steps.kind.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.kind.outputs.prerelease == 'true' && 'false' || 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/monitor-oc-x86_64
            dist/monitor-oc-x86_64.sha256
            dist/monitor-oc-x86_64-musl
            dist/monitor-oc-x86_64-musl.sha256
            install.sh
            packaging/Install-Monitor-OC.desktop
