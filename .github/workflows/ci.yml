name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      # Static binary: runs unchanged on SteamOS, Fedora, Bazzite, Arch, Ubuntu...
      - run: cargo build --release --target x86_64-unknown-linux-musl
      - run: cp target/x86_64-unknown-linux-musl/release/monitor-oc monitor-oc-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: monitor-oc-x86_64
          path: monitor-oc-x86_64
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: monitor-oc-x86_64
