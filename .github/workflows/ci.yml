name: CI

# Every push to main (Stable) or testing (test builds) that passes is built and
# published on the `dist` branch, where install.sh and the app's updater get it.
# There are no GitHub releases.

on:
  push:
    branches: [main, testing]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # luajit runs the Gamescope Lua harness and desktop-file-utils validates
      # the menu entries; those tests fail in CI when their tool is missing.
      # The GUI needs no -dev packages: eframe loads X11, Wayland and OpenGL
      # at runtime.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends luajit desktop-file-utils shellcheck
      - run: cargo fmt --check
      - run: .github/scripts/annotate.sh cargo clippy --all-targets --message-format=short -- -D warnings
      - run: .github/scripts/annotate.sh cargo clippy --all-targets --no-default-features --message-format=short -- -D warnings
      - run: .github/scripts/annotate.sh cargo test
      - run: .github/scripts/annotate.sh cargo test --no-default-features
      - run: shellcheck install.sh .github/scripts/*.sh
      - run: desktop-file-validate packaging/Install-Monitor-OC.desktop
      # main carries Stable builds (x.y.z), testing carries test builds (x.y.z.N).
      - name: Check VERSION for this branch
        if: github.event_name == 'push'
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          case "$GITHUB_REF_NAME:$version" in
            main:*.*.*.*) echo "::error file=VERSION::main must carry a Stable version, not $version"; exit 1 ;;
          esac

  build:
    needs: check
    # The oldest supported Ubuntu, so the app only needs glibc 2.35, which
    # SteamOS, Fedora and Bazzite all exceed.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Package
        run: |
          mkdir -p out
          cp target/release/monitor-oc out/monitor-oc-x86_64
          cp VERSION out/VERSION
          cd out
          sha256sum monitor-oc-x86_64 > monitor-oc-x86_64.sha256
          ./monitor-oc-x86_64 --version
          test "$(./monitor-oc-x86_64 --version)" = "monitor-oc $(tr -d '[:space:]' < VERSION)"
      # Install into a throwaway home and remove again.
      - name: Smoke-test install and uninstall
        env:
          HOME: ${{ runner.temp }}/home
        run: |
          mkdir -p "$HOME"
          out/monitor-oc-x86_64 install
          find "$HOME" -type f | sort
          test -x "$HOME/.local/bin/monitor-oc"
          test -f "$HOME/.local/share/applications/io.github.ravenor907.MonitorOC.desktop"
          "$HOME/.local/bin/monitor-oc" uninstall
          test -z "$(find "$HOME" -type f ! -name mimeinfo.cache)"
      - uses: actions/upload-artifact@v4
        with:
          name: monitor-oc
          path: out/*
          if-no-files-found: error

  publish:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-dist
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: monitor-oc
          path: new
      # dist holds stable/ and testing/ in a single commit that is replaced on
      # every publish, so builds never pile up in the repository's history.
      - name: Publish to the dist branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dir=stable
          [ "$GITHUB_REF_NAME" = testing ] && dir=testing
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          mkdir dist && cd dist
          git init -q -b dist
          if git fetch -q --depth 1 "$url" dist 2>/dev/null; then
            git checkout -q FETCH_HEAD -- . 2>/dev/null || true
          fi
          rm -rf "$dir" && mkdir "$dir"
          cp ../new/* "$dir/"
          cat > README.md <<'EOF'
          # Monitor OC builds

          Published by CI from `main` (stable/) and `testing` (testing/). Install with
          install.sh from the main branch; the app updates itself from here.
          EOF
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Builds: $dir $(cat "$dir/VERSION") from ${GITHUB_SHA::7}"
          git push -q -f "$url" HEAD:dist
          ls -l stable testing 2>/dev/null || true
